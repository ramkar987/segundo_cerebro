services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: segundo_cerebro
      POSTGRES_USER: segundo
      POSTGRES_PASSWORD: segundo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U segundo -d segundo_cerebro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
