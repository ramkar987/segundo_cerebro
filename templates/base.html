{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Segundo Cérebro{% endblock %}</title>
  <script>
    (() => {
      const saved = localStorage.getItem('segundo-cerebro-theme');
      const preferred = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
      document.documentElement.dataset.theme = saved || preferred;
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'home' %}">🧠 Segundo Cérebro</a>
    <nav>
      <a href="{% url 'home' %}">Capturar</a>
      <a href="{% url 'library' %}">Biblioteca</a>
      <a href="{% url 'connections' %}">Conexões</a>
      <a href="/admin/">Admin</a>
      <button
        type="button"
        class="theme-toggle"
        id="theme-toggle"
        aria-label="Alternar modo claro e escuro"
        title="Alternar modo claro e escuro"
      >🌙</button>
    </nav>
  </header>
  <main class="container">
    {% if messages %}
      {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    (() => {
      const button = document.getElementById('theme-toggle');
      if (!button) return;

      const applyLabel = () => {
        const dark = document.documentElement.dataset.theme === 'dark';
        button.textContent = dark ? '☀️' : '🌙';
        button.setAttribute(
          'aria-label',
          dark ? 'Ativar modo claro' : 'Ativar modo escuro'
        );
        button.title = dark ? 'Ativar modo claro' : 'Ativar modo escuro';
      };

      button.addEventListener('click', () => {
        const next =
          document.documentElement.dataset.theme === 'dark'
            ? 'light'
            : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('segundo-cerebro-theme', next);
        applyLabel();
      });

      applyLabel();
    })();
  </script>
</body>
</html>
